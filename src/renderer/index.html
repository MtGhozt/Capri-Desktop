<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self' capri: blob:; connect-src 'self' capri:">
  <title>Capri</title>
  <link rel="stylesheet" href="styles/capri.css">
</head>
<body>
  <div id="capri" class="capri">
    <canvas id="sprite" class="capri__sprite" aria-label="Capri"></canvas>
  </div>

  <canvas id="fx" class="fx" aria-hidden="true"></canvas>

  <canvas id="chip" class="chip" hidden aria-label="Capri’s biochip"></canvas>
  <canvas id="mask" class="chip" hidden aria-label="Capri, asleep"></canvas>

  <aside id="panel" class="panel" data-kind="info" hidden aria-live="polite">
    <div class="panel__frame">
      <div class="panel__plate">
        <figure class="panel__face" aria-hidden="true">
          <img src="../../assets/capri/capri-face.png" alt="">
        </figure>
        <div class="panel__body">
          <header class="panel__meta">
            <span class="panel__who">Capri</span>
            <span class="panel__tag"></span>
            <span class="panel__state"></span>
          </header>
          <p class="panel__line"></p>
          <p class="panel__quote" hidden></p>
          <div class="panel__reply" hidden></div>
          <p class="panel__summary" hidden></p>
          <ol class="panel__log" hidden></ol>
          <div class="panel__actions" hidden></div>
        </div>
      </div>
      <div class="panel__tail" aria-hidden="true"></div>
    </div>
  </aside>

  <button id="dormant" class="dormant" type="button" hidden>
    <canvas class="dormant__star" width="36" height="36" aria-hidden="true"></canvas>
    <span class="dormant__label">CAPRI // <span class="dormant__state">DORMANT</span></span>
  </button>

  <nav id="app-menu" class="appmenu" hidden></nav>

  <div id="vhs" class="vhs" hidden aria-hidden="true"></div>

  <aside id="bubble" class="bubble" hidden>
    <div class="bubble__frame">
      <div class="bubble__log" aria-live="polite"></div>
      <label class="bubble__prompt">
        <span class="bubble__you">YOU &gt;</span>
        <input class="bubble__field" type="text" maxlength="500" placeholder="say something..." autocomplete="off" spellcheck="false">
      </label>
      <footer class="bubble__status">CAPRI // <span class="bubble__state">ONLINE</span></footer>
    </div>
  </aside>

  <div id="ticker" class="ticker" hidden>
    <div class="ticker__plate">
      <span class="ticker__dot" aria-hidden="true"></span>
      <span class="ticker__verb"></span>
      <span class="ticker__target"></span>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
